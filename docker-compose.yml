# Pocket Draw — sketches, text diagrams and draw.io diagrams (Go + SQLite).
# `docker compose up -d` starts the app and draw.io for the Diagram kind. draw.io has no port of
# its own: Pocket Draw serves it at /drawio/ on its own address. Don't want it? Delete the drawio
# service and DRAWIO_INTERNAL_URL; diagrams can then use https://embed.diagrams.net or yours.
services:
  pocket-draw:
    image: ghcr.io/abjelosevic88/pocket-homelab-draw:latest
    container_name: pocket-draw
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Diagrams open in draw.io: the drawio service below, served by this app at /drawio/.
      DRAWIO_INTERNAL_URL: ${DRAWIO_INTERNAL_URL:-http://drawio:8080}
      # Or another draw.io the browser reaches (e.g. https://embed.diagrams.net); wins over the one above.
      DRAWIO_URL: ${DRAWIO_URL:-}
      # The owner's own connections; everything can also be set under Settings.
      NOTIFY_URL: ${NOTIFY_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Pocket Core: one sign-in and app links instead of tokens.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      drawio:
        condition: service_started
        required: false

  # draw.io, the official image (static: no data of its own; diagrams are kept by Pocket Draw).
  drawio:
    image: jgraph/drawio:latest
    container_name: pocket-draw-drawio
    restart: unless-stopped
