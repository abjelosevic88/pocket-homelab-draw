# Pocket Draw — sketches, text diagrams and draw.io diagrams (Go + SQLite). One container, one volume.
services:
  pocket-draw:
    image: ghcr.io/abjelosevic88/pocket-homelab-draw:latest
    container_name: pocket-draw
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Diagrams open in draw.io: your own (the drawio service below) or https://embed.diagrams.net.
      DRAWIO_URL: ${DRAWIO_URL:-}
      # The owner's own connections; everything can also be set under Settings.
      NOTIFY_URL: ${NOTIFY_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Pocket Core: one sign-in and app links instead of tokens.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional: your own draw.io for the Diagram kind (the browser loads it, so
  # DRAWIO_URL must be an address the browser reaches, e.g. http://localhost:8081).
  # drawio:
  #   image: jgraph/drawio:latest
  #   restart: unless-stopped
  #   ports:
  #     - "8081:8080"
